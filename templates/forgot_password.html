<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — SnapFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f6f2; --bg2: #f1ece4;
            --border: rgba(43,57,144,0.12); --border2: rgba(43,57,144,0.2);
            --text: #1a1210; --muted: #7a6560; --faint: #c4b0a8;
            --navy: #2B3990; --navy2: #3a4ea8;
            --navy-dim: rgba(43,57,144,0.07); --navy-glow: rgba(43,57,144,0.14);
            --crimson: #8B1A2E;
            --success: #2d7a4f; --danger: #c0392b;
            --radius: 10px; --radius-lg: 16px;
            --font-head: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body); background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-blob { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; animation: blobDrift 26s ease-in-out infinite alternate; }
        .bg-blob-1 { width: 700px; height: 700px; background: radial-gradient(circle, rgba(43,57,144,0.06), transparent 65%); top: -250px; left: -200px; }
        .bg-blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(139,26,46,0.055), transparent 65%); bottom: -150px; right: -130px; animation-delay: -10s; }
        @keyframes blobDrift { 0% { transform: translate(0,0); } 100% { transform: translate(-14px,22px) scale(0.97); } }

        .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; animation: pageIn .5s ease both; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
            border: 1px solid var(--border2); border-radius: var(--radius-lg);
            padding: 36px; box-shadow: 0 8px 32px rgba(43,57,144,0.08), 0 2px 8px rgba(0,0,0,0.04);
        }
        .card::before {
            content: ''; display: block; height: 3px;
            background: linear-gradient(90deg, #2B3990, #8B1A2E);
            border-radius: 2px 2px 0 0; margin: -36px -36px 28px;
        }
        .icon { font-size: 2.2rem; text-align: center; display: block; margin-bottom: 12px; }
        .card-title { font-family: var(--font-head); font-size: 1.45rem; font-weight: 800; color: var(--text); margin-bottom: 4px; text-align: center; }
        .card-subtitle { color: var(--muted); font-size: .87rem; margin-bottom: 24px; text-align: center; line-height: 1.55; }

        .flash { padding: 10px 14px; margin-bottom: 14px; font-size: .83rem; border-radius: var(--radius); }
        .flash.danger  { background: rgba(192,57,43,0.07); color: var(--danger); border: 1px solid rgba(192,57,43,0.18); }
        .flash.success { background: rgba(45,122,79,0.07); color: var(--success); border: 1px solid rgba(45,122,79,0.18); }
        .flash.warning { background: rgba(139,26,46,0.07); color: var(--crimson); border: 1px solid rgba(43,57,144,0.13); }

        .fg { margin-bottom: 18px; }
        .fg label { display: block; font-size: .69rem; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
        .fg input {
            width: 100%; padding: 11px 14px; border: 1.5px solid rgba(43,57,144,0.15);
            border-radius: var(--radius); font-family: var(--font-body); font-size: .93rem;
            background: #fff; color: var(--text); transition: border-color .2s, box-shadow .2s; -webkit-appearance: none;
        }
        .fg input::placeholder { color: var(--faint); }
        .fg input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(43,57,144,0.08); }

        .hint {
            background: var(--navy-dim); border: 1px solid rgba(43,57,144,0.14);
            border-left: 3px solid var(--navy); border-radius: 0 var(--radius) var(--radius) 0;
            padding: 10px 14px; font-size: .8rem; color: var(--navy); margin-bottom: 20px; line-height: 1.5;
        }

        .submit-btn {
            width: 100%; padding: 13px; background: var(--navy); color: #fff;
            border: none; border-radius: var(--radius); font-family: var(--font-body);
            font-size: .95rem; font-weight: 700; cursor: pointer;
            transition: background .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 2px 10px var(--navy-glow);
        }
        .submit-btn:hover { background: var(--navy2); transform: translateY(-1px); }

        .switch { text-align: center; margin-top: 18px; font-size: .85rem; color: var(--muted); }
        .switch a { color: var(--navy); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>
<canvas id="c"></canvas>

<div class="wrap">
    <div class="card">
        <span class="icon">🔑</span>
        <div class="card-title">Forgot password?</div>
        <p class="card-subtitle">Enter your email and we'll send you an OTP to reset your password.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="fg">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required autofocus>
            </div>
            <button type="submit" class="submit-btn">Send OTP →</button>
        </form>
    </div>
    <div class="switch"><a href="{{ url_for('login') }}">← Back to sign in</a></div>
</div>

<script>
(function() {
    const cv=document.getElementById('c'),ctx=cv.getContext('2d');
    let W,H,mx=innerWidth/2,my=innerHeight/2;
    const SPACING=38,DOT_R=1.3,COLOR='43,57,144',GOLD='139,26,46',RADIUS=160;
    let t=0;
    function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
    resize();window.addEventListener('resize',resize);
    window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    const b1=document.querySelector('.bg-blob-1'),b2=document.querySelector('.bg-blob-2');
    (function loop(){
        ctx.clearRect(0,0,W,H);t+=0.003;
        const rx=mx/W-.5,ry=my/H-.5;
        if(b1)b1.style.transform=`translate(${rx*28}px,${ry*18}px)`;
        if(b2)b2.style.transform=`translate(${-rx*20}px,${-ry*14}px)`;
        const cols=Math.ceil(W/SPACING)+2,rows=Math.ceil(H/SPACING)+2;
        for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
            const x=i*SPACING+Math.sin(t+j*.5)*1.5,y=j*SPACING+Math.cos(t+i*.5)*1.5;
            const dx=x-mx,dy=y-my,dist=Math.sqrt(dx*dx+dy*dy);
            const prox=Math.max(0,1-dist/RADIUS);
            ctx.beginPath();ctx.arc(x,y,DOT_R+prox*2.8,0,Math.PI*2);
            ctx.fillStyle=`rgba(${prox>.45?GOLD:COLOR},${0.07+prox*.3})`;ctx.fill();
        }
        requestAnimationFrame(loop);
    })();
})();
</script>
</body>
</html>
