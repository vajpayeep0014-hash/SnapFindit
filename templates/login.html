<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SnapFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#070a12;--bg2:#0c1120;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.08);--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#dde8f8;--muted:#6a7d9e;--faint:#1e2d4a;--accent:#00d4ff;--accent2:#38e8ff;--accent-dim:rgba(0,212,255,.1);--accent-glow:rgba(0,212,255,.22);--success:#34d399;--danger:#f87171;--radius:12px;--radius-lg:18px;--font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;overflow:hidden;}
        .orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.13;animation:float 20s ease-in-out infinite alternate;}
        .orb-1{width:600px;height:600px;background:#00d4ff;top:-200px;left:-150px;}
        .orb-2{width:500px;height:500px;background:#7c3aed;bottom:-180px;right:-130px;animation-delay:-8s;}
        @keyframes float{0%{transform:translate(0,0)}50%{transform:translate(30px,-25px)}100%{transform:translate(-15px,30px)}}
        canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
        .wrap{width:100%;max-width:400px;position:relative;z-index:1;}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
        .brand-icon{width:32px;height:32px;background:var(--accent-dim);border:1px solid rgba(0,212,255,.25);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--accent);box-shadow:0 0 16px var(--accent-glow);}
        .brand-name{font-family:var(--font-head);font-weight:800;font-size:1.1rem;color:var(--text);}
        .card{background:rgba(12,17,32,.92);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:36px;box-shadow:0 0 60px rgba(0,212,255,.05),0 32px 64px rgba(0,0,0,.5);}
        .card h1{font-family:var(--font-head);font-size:1.65rem;font-weight:800;margin-bottom:6px;letter-spacing:-.2px;}
        .subtitle{color:var(--muted);font-size:.88rem;font-weight:300;margin-bottom:22px;}
        .hint{background:var(--accent-dim);border:1px solid rgba(0,212,255,.18);border-radius:var(--radius);padding:10px 14px;font-size:.79rem;color:var(--accent2);margin-bottom:20px;line-height:1.5;}
        .flash{padding:10px 14px;margin-bottom:14px;font-size:.83rem;border-radius:var(--radius);}
        .flash.danger{background:rgba(248,113,113,.08);color:var(--danger);border:1px solid rgba(248,113,113,.18);}
        .flash.success{background:rgba(52,211,153,.08);color:var(--success);border:1px solid rgba(52,211,153,.18);}
        .fg{margin-bottom:16px;}
        .fg label{display:block;font-size:.71rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
        .fg input{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:var(--radius);font-family:var(--font-body);font-size:.92rem;background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;}
        .fg input::placeholder{color:var(--faint);}
        .fg input:focus{outline:none;border-color:rgba(0,212,255,.45);box-shadow:0 0 0 3px rgba(0,212,255,.07);}
        .submit-btn{width:100%;padding:12px;background:var(--accent);color:#07090f;border:none;border-radius:var(--radius);font-family:var(--font-head);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 0 20px var(--accent-glow);margin-top:4px;}
        .submit-btn:hover{background:var(--accent2);box-shadow:0 0 32px rgba(0,212,255,.45);transform:translateY(-1px);}
        .divider{border:none;border-top:1px solid var(--border);margin:22px 0;}
        .stats{display:flex;justify-content:center;gap:28px;}
        .stat{text-align:center;}
        .stat strong{font-family:var(--font-head);font-size:1.5rem;font-weight:800;color:var(--accent);display:block;text-shadow:0 0 20px var(--accent-glow);}
        .stat span{font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
        .switch{text-align:center;margin-top:18px;font-size:.84rem;color:var(--muted);}
        .switch a{color:var(--accent);text-decoration:none;font-weight:500;}
        .switch a:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div>
<canvas id="c"></canvas>
<div class="wrap">
    <div class="brand"><span class="brand-icon">◈</span><span class="brand-name">SnapFind</span></div>
    <div class="card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in with your Medicaps college ID.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
        <div class="hint">🎓 Only <strong>@medicaps.ac.in</strong> addresses are accepted.</div>
        <form method="POST">
            <div class="fg"><label>College Email</label><input type="email" name="email" placeholder="0901CS211001@medicaps.ac.in" required autofocus></div>
            <div class="fg"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
            <button type="submit" class="submit-btn">Sign In →</button>
        </form>
        <hr class="divider">
        <div class="stats">
            <div class="stat"><strong id="a">—</strong><span>Active Items</span></div>
            <div class="stat"><strong id="c2">—</strong><span>Returned</span></div>
        </div>
    </div>
    <div class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></div>
</div>
<script>
fetch('/api/stats').then(r=>r.json()).then(d=>{document.getElementById('a').textContent=d.active;document.getElementById('c2').textContent=d.claimed;}).catch(()=>{});
(function(){const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,pts;const N=55,D=130,CLR='0,212,255';function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}function mk(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.3+.4};}resize();pts=Array.from({length:N},mk);window.addEventListener('resize',resize);(function loop(){ctx.clearRect(0,0,W,H);for(let i=0;i<N;i++){const p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${CLR},.5)`;ctx.fill();for(let j=i+1;j<N;j++){const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<D){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(${CLR},${(1-d/D)*.15})`;ctx.lineWidth=.5;ctx.stroke();}}}requestAnimationFrame(loop);})();})();
</script>
</body>
</html>
